# deploy/gcp/cloudbuild.yaml
# Google Cloud Build configuration for AdaptiveCloud
# Builds and deploys Backend API and Frontend Dashboard to Google Cloud Run
substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: adaptivecloud-backend
  _FRONTEND_SERVICE: adaptivecloud-frontend

steps:
  # ── Step 1: Build Backend Container ─────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # ── Step 2: Push Backend Container ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA']

  # ── Step 3: Deploy Backend to Google Cloud Run ──────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_BACKEND_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=ENVIRONMENT=production,DEBUG=false,PROJECT_ID=$PROJECT_ID'

  # ── Step 4: Build Frontend Container ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # ── Step 5: Push Frontend Container ─────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA']

  # ── Step 6: Deploy Frontend to Google Cloud Run ─────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_FRONTEND_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:latest'
  - 'gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:latest'
